      meta: 中国
      body: 主要关注模型微调与 AI 模型评测能力建设，包括评估模型行为、提升回复质量、支持模型迭代优化的工程流程。
    - role: 软件开发工程师
      org: TikTok
      meta: 2023 - 2025
      body: 参与面向大规模用户的生产级软件系统开发，工作覆盖用户侧产品功能、AIGC 社交体验和后端工程。参与多个地区上线的社交产品能力建设，与产品、设计、算法等团队协作，推进推荐相关工程优化，重点关注系统可靠性、可维护性和产品效果。
    - role: 计算机科学硕士
      org: Carnegie Mellon University
      meta: Pittsburgh
      body: 学习方向覆盖机器学习、自然语言处理、搜索引擎、分布式系统和生产环境机器学习等课程。
