  about_title: 关于我
  about_body: "我是一名 AI / 大模型方向工程师，拥有 TikTok 生产级软件工程经验，覆盖用户侧产品功能、AIGC 社交体验和后端工程。过去我参与过面向大规模用户的社交产品体验、推荐入口和虚拟身份相关能力建设，也与产品、设计、算法等团队协作推进工程落地。当前我主要关注模型微调、AI 模型评测能力和大模型应用工程化，希望把模型能力稳定地转化为可用、可评估、可迭代的产品体验。"
